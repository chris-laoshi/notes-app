<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles_v2.css" />
</head>
<body>
  <div class="page">
    <header class="app-header">
      <div>
        <h1>Notes</h1>
        <p class="subtitle" id="today-label"></p>
      </div>
      <button class="icon-btn" id="theme-toggle" aria-label="Toggle dark mode"></button>
    </header>

    <form class="composer" id="composer">
      <textarea class="note-input" id="composer-input" rows="1" placeholder="What's on your mind?"></textarea>
      <div class="input-row" id="composer-row">
        <span class="spacer"></span>
        <span class="hint"><kbd>Enter</kbd> to save · <kbd>Shift</kbd>+<kbd>Enter</kbd> new line</span>
        <button type="submit" class="btn primary" id="composer-add" disabled></button>
      </div>
    </form>

    <main id="list-root"></main>
  </div>

  <div class="toast" id="toast" role="status">
    <span>Note deleted</span>
    <button id="undo">Undo</button>
  </div>

  <script type="module" src="app_v2.js"></script>
</body>
</html>
